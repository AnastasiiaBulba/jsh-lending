<section class="hero">
  <div class="hero-wrapper-dop">
    <div class="hero-wrapper">
      <div class="hero-wrap-text">
        <h1 class="hero-title">Unleash Your Inner Hero!</h1>
        <p class="hero-text">
          Empowering kids and teens with strength, discipline and confidence.
        </p>
      </div>

      <div class="hero-wrap-img">
        <picture class="hero-image">
          <source
            srcset="./img/hero/hero-superman-desk.png"
            media="(min-width: 1440px)"
          />
          <source
            srcset="./img/hero/hero-superman-mob.png"
            media="(max-width: 1439px)"
          />
          <img src="./img/hero/hero-superman-mob.png" alt="Superman image" />
        </picture>
      </div>
    </div>
  </div>
</section>
